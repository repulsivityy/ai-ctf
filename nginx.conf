events {
    worker_connections 1024;
}

http {
    # per-IP cap on chat requests — a scripted client can't outpace this, real
    # players never come close. ~1 msg / 2s sustained, short bursts allowed.
    limit_req_zone $binary_remote_addr zone=chat:10m rate=30r/m;

    # shared proxy config for both locations below
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;   # Gemini + tool-call round trips take a few seconds

    server {
        listen 80;

        client_max_body_size 64k;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; base-uri 'none'; frame-ancestors 'none'" always;

        location = /api/chat {
            limit_req zone=chat burst=5 nodelay;
            limit_req_status 429;
            proxy_pass http://aegis-ctf:8000;
        }

        location / {
            proxy_pass http://aegis-ctf:8000;
        }
    }
}
