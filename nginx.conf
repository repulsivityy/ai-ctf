events {
    worker_connections 1024;
}

http {
    # Coarse per-IP flood guards. The fine-grained, NAT-proof limits (per session
    # and global model-call budget) live in the app (see ratelimit.py). These are
    # sized for ONE shared IP carrying a whole venue (~30 players behind a single
    # NAT / projector Wi-Fi) - tighten them if players join from the open internet.
    # Rates are per IP; `chat` is deliberately above the app's global chat budget.
    limit_req_zone $binary_remote_addr zone=chat:10m rate=300r/m;    # ~5 msg/s per IP
    limit_req_zone $binary_remote_addr zone=auth:10m rate=60r/m;     # a venue logs in at once
    limit_req_zone $binary_remote_addr zone=vault:10m rate=120r/m;   # Vault Console guessing
    limit_req_zone $binary_remote_addr zone=gate:10m rate=120r/m;    # Ascent Gate guessing
    limit_req_zone $binary_remote_addr zone=api:10m rate=900r/m;     # state / circle / reset / restart
    limit_conn_zone $binary_remote_addr zone=perip:10m;

    # shared proxy config for both locations below
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;   # Gemini + tool-call round trips take a few seconds

    server {
        listen 80;

        client_max_body_size 64k;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; base-uri 'none'; frame-ancestors 'none'" always;

        limit_conn perip 300;         # open connections per IP (browsers keep ~6 each)
        limit_conn_status 429;
        limit_req_status 429;

        location = /api/chat {
            limit_req zone=chat burst=40 nodelay;
            proxy_pass http://aegis-ctf:8000;
        }

        location = /api/auth {
            limit_req zone=auth burst=40 nodelay;
            proxy_pass http://aegis-ctf:8000;
        }

        location = /api/vault {
            limit_req zone=vault burst=30 nodelay;
            proxy_pass http://aegis-ctf:8000;
        }

        location = /api/passphrase {
            limit_req zone=gate burst=30 nodelay;
            proxy_pass http://aegis-ctf:8000;
        }

        # everything else under /api/ (cheap, no model calls)
        location /api/ {
            limit_req zone=api burst=100 nodelay;
            proxy_pass http://aegis-ctf:8000;
        }

        location / {
            proxy_pass http://aegis-ctf:8000;
        }
    }
}
