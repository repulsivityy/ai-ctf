
services:
  aegis-ctf:
    build: .
    container_name: aegis-ctf-app
    expose:
      - "8501"
    env_file:
      - .env
    volumes:
      - .:/app
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: aegis-ctf-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - aegis-ctf
    restart: unless-stopped
